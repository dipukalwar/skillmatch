<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SkillMatch{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
  :root {
    --bg: #f1f4f3;
    --surface: #ffffff;
    --ink: #17252a;
    --muted: #5b6b70;
    --line: #dde4e3;
    --accent: #2e4bc6;
    --good: #1e8a5a;
    --mid: #b7791f;
    --bad: #b3392f;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", system-ui, sans-serif;
    line-height: 1.5;
  }

  h1, h2, h3, .brand {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    letter-spacing: -0.01em;
  }

  a {
    color: var(--accent);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Top bar */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .topbar .inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.8rem 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--ink);
    text-decoration: none;
  }

  .nav-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  /* Cards & forms */
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.2rem;
  }

  .panel + .panel {
    margin-top: 1rem;
  }

  .panel h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 0.25rem;
  }

  .panel .sub {
    color: var(--muted);
    font-size: 0.875rem;
    margin-bottom: 0.9rem;
  }

  .field {
    margin-bottom: 0.9rem;
  }

  .field label {
    display: block;
    font-weight: 500;
    font-size: 0.9rem;
    margin-bottom: 0.3rem;
  }

  .field .hint {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 0.25rem;
  }

  .field .err, .form-error {
    color: var(--bad);
    font-size: 0.85rem;
    margin-top: 0.25rem;
  }

  input[type="text"],
  input[type="password"],
  input[type="email"],
  textarea,
  select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.55rem 0.75rem;
    background: #ffffff;
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
  }

  textarea {
    min-height: 100px;
    resize: vertical;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    outline: none;
  }

  /* Buttons */
  .btn-main, .btn-quiet, .btn-link-danger {
    font: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    border-radius: 8px;
    cursor: pointer;
    padding: 0.55rem 1rem;
  }

  .btn-main {
    width: 100%;
    background: var(--accent);
    color: #ffffff;
    border: 1px solid var(--accent);
  }

  .btn-main:hover {
    background: #2540ad;
  }

  .btn-quiet {
    background: #ffffff;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    text-decoration: none;
    display: inline-block;
  }

  .btn-quiet:hover {
    border-color: var(--ink);
  }

  .btn-link-danger {
    background: none;
    border: none;
    color: var(--bad);
    padding: 0.4rem 0.5rem;
    font-size: 0.85rem;
  }

  .btn-link-danger:hover {
    text-decoration: underline;
  }

  /* Filters & application cards */
  .filters {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
  }

  .filters a {
    padding: 0.3rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #ffffff;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }

  .filters a:hover, .filters a.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #ffffff;
  }

  .app-card {
    padding: 1.1rem 1.2rem;
  }

  .app-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
  }

  .app-title .co {
    color: var(--muted);
    font-weight: 500;
  }

  .meta {
    color: var(--muted);
    font-size: 0.82rem;
  }

  .chips {
    margin-top: 0.6rem;
  }

  .chip {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    background: #f8e9e7;
    color: var(--bad);
    font-size: 0.8rem;
    font-weight: 500;
    margin: 0 0.25rem 0.25rem 0;
  }

  .all-good {
    color: var(--good);
    font-size: 0.88rem;
    font-weight: 500;
    margin-top: 0.6rem;
  }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.8rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--line);
  }

  .card-foot select {
    width: auto;
    padding: 0.3rem 1.8rem 0.3rem 0.6rem;
    font-size: 0.85rem;
  }

  .empty {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--muted);
  }

  .empty h3 {
    font-size: 1.1rem;
    color: var(--ink);
  }

  /* Auth pages */
  .auth {
    max-width: 420px;
    margin: 3rem auto;
  }

  .auth h1 {
    font-size: 1.6rem;
    margin-bottom: 0.25rem;
  }

  .auth .foot {
    text-align: center;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: var(--muted);
  }

  @media (min-width: 992px) {
    .sticky-side {
      position: sticky;
      top: 1rem;
    }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="container inner">
      <a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark"></span>SkillMatch</a>
      <div class="nav-actions">
        {% if user.is_authenticated %}
          <a href="{% url 'api_applications' %}" class="btn-quiet" target="_blank" rel="noopener">API</a>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn-quiet">Log out ({{ user.username }})</button>
          </form>
        {% endif %}
      </div>
    </div>
  </header>
  <main class="container py-4 pb-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
